[package]
name = "hyperliquid-rs"
version = "0.1.0"
edition = "2024"
authors = ["Elijah Hampton:elijahhamptonj@proton.me"]

[[example]]
name = "account_status"
path = "examples/account_status.rs"

[[example]]
name = "perp_market_data"
path = "examples/perp_market_data.rs"

[[example]]
name = "spot_market_data"
path = "examples/spot_market_data.rs"

[[example]]
name = "aligned_quote_token_status"
path = "examples/aligned_quote_token_status.rs"

[[example]]
name = "vault_details"
path = "examples/vault_details.rs"

[[example]]
name = "order_status_by_oid_or_cloid"
path = "examples/order_status_by_oid_or_cloid.rs"


[dependencies]
alloy = "1.1.2"
once_cell = "1.21.3"
reqwest = { version = "0.12.24", features = ["json"] }
rust_decimal = { version = "1.39.0", features = ["serde", "serde-float"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-test = "0.4.4"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
