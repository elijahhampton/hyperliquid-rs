[package]
name = "hyperliquid-rs"
version = "0.1.0"
edition = "2024"

[[example]]
name = "test_mids"
path = "examples/test_mids.rs"

[[example]]
name = "test_l2book"
path = "examples/test_l2book.rs"

[[example]]
name = "test_getcandles"
path = "examples/test_getcandles.rs"

[dependencies]
once_cell = "1.21.3"
reqwest = { version = "0.12.24", features = ["json"] }
rust_decimal = { version = "1.39.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-test = "0.4.4"
